# 这个文件会被 include 到主配置的 http{} 块内部，
# 所以只能写 server 级别指令（不能有 pid / events / http）。
# 临时路径与 pid 由 nginxinc/nginx-unprivileged 镜像的主配置处理。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存（文件名带 hash，可安全缓存）
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 干净 URL：/posts/hello-world -> /posts/hello-world/index.html
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    # 自定义 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 基础安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
